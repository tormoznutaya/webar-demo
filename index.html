<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR — Model Viewer</title>

  <!-- Подключаем библиотеку model-viewer с CDN -->
  <script type="module"
          src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #202020;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    h1 {
      text-align: center;
      font-size: 18px;
      padding: 12px;
      margin: 0;
    }
    model-viewer {
      width: 100%;
      height: 80vh;
      background: #303030;
    }
  </style>
</head>
<body>

  <h1>WebAR: нажмите «View in your space» на телефоне</h1>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="3D модель для AR"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="hdri/studio.hdr"
    exposure="1"
    scale="1 1 1"
    tone-mapping="neutral">

    <button slot="ar-button"
            style="position: absolute; bottom: 20px; right: 20px;
                   padding: 12px 20px; border: none; border-radius: 24px;
                   background: #4285f4; color: #fff; font-size: 16px;
                   cursor: pointer;">
      View in your space
    </button>

    <div slot="poster"
         style="display: flex; align-items: center; justify-content: center;
                height: 100%; color: #ccc;">
      Загрузка 3D модели…
    </div>
  </model-viewer>

</body>
</html>
